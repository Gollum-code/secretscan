# secretscan 配置示例：自定义格式 + 白名单 + 忽略路径
#
# 用法：secretscan --config secretscan.example.toml .

# ── 全局设置 ─────────────────────────────────────────────────────
[settings]
# 白名单正则：值命中则跳过（通常用于 CI 测试占位密钥）
allowlist = [
  "^AKIAIOSFODNN7EXAMPLE$",   # AWS 官方文档示例
  "^wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY$",
]

# 忽略的路径子串（命中即跳过整个文件）
ignore_paths = [
  "vendor/",
  "test-data/",
  "secretscan-report/",
]

# ── 自定义格式 ────────────────────────────────────────────────────
# 支持命名捕获组 (?P<value>...) 精确提取密钥值；category: cloud|ai|im|email|payment|cicd|other
[[custom_formats]]
id = "internal_platform_token"
name = "内部平台 Token"
category = "cloud"
pattern = "(?i)(?:internal_platform_token|INTERNAL_PLATFORM)\\s*[=:]\\s*(?P<value>[A-Za-z0-9]{20,})"
weight = 7
rotate_hint = "联系 SRE 平台组：https://sre.internal/credentials 轮换"

[[custom_formats]]
id = "company_vault_token"
name = "公司 Vault Token"
category = "other"
pattern = "\\b(?P<value>vault-[0-9a-f]{32}-[0-9a-f]{16})\\b"
weight = 6
rotate_hint = "Vault 管理员门户 → 服务令牌 → 重新生成"
