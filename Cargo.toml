[package]
name = "secretscan"
version = "0.1.0"
edition = "2021"
description = "密钥格式识别与轮换治理 CLI：识别 20+ 云/服务密钥，风险评分，生成轮换清单与 HTML 看板"
license = "MIT"

[[bin]]
name = "secretscan"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ignore = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]

[profile.release]
lto = true
strip = true
